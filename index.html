<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon setup gaming</title>
<style>
:root{--bg:#f3f0f7;--ink:#1d1a2e;--mute:#6a6580;--card:#ffffff;--line:#d9d3e6;--cyan:#12a8a0;--tip:#1d1a2e;--tipink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122a;--ink:#f1eefb;--mute:#a49fc0;--card:#201d3d;--line:#38335f;--cyan:#4de0d0;--tip:#f1eefb;--tipink:#1d1a2e}}
:root[data-theme="dark"]{--bg:#14122a;--ink:#f1eefb;--mute:#a49fc0;--card:#201d3d;--line:#38335f;--cyan:#4de0d0;--tip:#f1eefb;--tipink:#1d1a2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;line-height:1.5}
main{max-width:1100px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:0 0 8px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 22px;max-width:60ch}
.scene{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;position:relative}
#stage{width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;touch-action:pan-y;background:#1d1a3a}
@media (max-width:640px){#stage{aspect-ratio:1/1}}
#stage canvas{display:block;width:100%;height:100%;cursor:default}
#back{position:absolute;left:20px;top:20px;border:0;border-radius:999px;padding:8px 14px;font:inherit;background:#f1eefb;color:#1d1a2e;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#back[hidden]{display:none}
#back:focus-visible{outline:2px solid var(--cyan)}
.hint{font-size:.9rem;color:var(--mute);margin:10px 4px 2px}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--tip);color:var(--tipink);padding:10px 13px;border-radius:10px;max-width:250px;font-size:.88rem;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.show{opacity:1;transform:none}
#tip b{display:block;font-size:1rem}
#tip i{font-style:normal;opacity:.7;font-size:.8rem}
#tip img{width:100%;height:130px;object-fit:contain;border-radius:6px;margin-bottom:8px;display:block;background:#fff}
h2{font-size:1.4rem;margin:34px 0 12px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;list-style:none;padding:0;margin:0}
.list button{width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.list button:hover,.list button:focus-visible{border-color:var(--cyan);outline:2px solid var(--cyan);outline-offset:0}
.list small{display:block;color:var(--mute)}
.list strong{display:block}
.list img{width:100%;height:90px;object-fit:contain;background:#fff;border-radius:6px;margin-bottom:6px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Mon setup gaming</h1>
<p class="sub">Mon bureau en 3D. Passe la souris (ou touche) un objet pour voir son nom et son modèle.</p>
<div class="scene">
<div id="stage"></div>
<button id="back" hidden>Retour au bureau</button>
<p class="hint">Passe la souris (ou touche) un objet pour voir son modèle. Clique sur mon PC pour entrer dedans.</p>
</div>
<h2>Tout mon matériel</h2>
<ul class="list" id="list"></ul>
</main>
<div id="tip" role="tooltip"></div>

const tip=document.getElementById('tip'),list=document.getElementById('list'),stage=document.getElementById('stage'),backBtn=document.getElementById('back');
function html(it){return (it.img?'<img src="'+it.img+'" alt="">':'')+'<i>'+it.cat+'</i><b>'+it.name+'</b>'+it.model+'<br><i>'+it.info+'</i>';}
function place(x,y){const w=tip.offsetWidth,h=tip.offsetHeight;let l=x+16,t=y+16;if(l+w>innerWidth-8)l=x-w-16;if(t+h>innerHeight-8)t=y-h-16;tip.style.left=Math.max(8,l)+'px';tip.style.top=Math.max(8,t)+'px';}
function showTip(id,x,y){if(!ITEMS[id])return;tip.innerHTML=html(ITEMS[id]);tip.classList.add('show');place(x,y);}
function hideTip(){tip.classList.remove('show');}

Object.keys(ITEMS).forEach(id=>{
  const it=ITEMS[id],li=document.createElement('li'),b=document.createElement('button');

  const on=v=>()=>{if(window.hl3d)window.hl3d(v?id:null);};
  b.addEventListener('mouseenter',on(true));b.addEventListener('mouseleave',on(false));

});

  for(let i=0;i<9;i++){const pv=new T.Group();pv.rotation.z=i*Math.PI*2/9;rot.add(pv);const b=new T.Mesh(bg,bm);b.position.x=r*.26;b.rotation.x=.5;pv.add(b);}
  const hub=new T.Mesh(new T.CylinderGeometry(r*.27,r*.27,.1,24),K(0x15141c));hub.rotation.x=Math.PI/2;hub.position.z=.03;g.add(hub);
  [.2,.12].forEach(k=>{const t=new T.Mesh(new T.TorusGeometry(r*k,.012,6,32),dark?K(0x555560):G());t.position.z=.085;g.add(t);});
  const hit=new T.Mesh(new T.CircleGeometry(r*1.02,32),new T.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));hit.position.z=.12;g.add(hit);
  return g;}
const fr=part('pc');
box(3.4,3.9,.05,K(0x0b0a12),0,0,-.85,fr);box(3.4,.08,1.7,K(0x0b0a12),0,1.95,0,fr);box(3.4,.08,1.7,K(0x0b0a12),0,-1.95,0,fr);
box(.08,3.9,1.7,K(0x0b0a12),-1.7,0,0,fr);box(.08,3.9,1.7,K(0x0b0a12),1.7,0,0,fr);box(.02,3.7,.04,G(),-1.74,0,.8,fr);
const mobo=part('mobo');box(2.3,2.5,.05,K(0x16151f),.3,.35,-.78,mobo);box(2.1,.02,.01,G(),.3,-.6,-.75,mobo);
const cpu=part('cpu');box(.55,.55,.06,K(0x24232e),.3,.85,-.72,cpu);
const ram=part('ram');[.99,1.12,1.25,1.38].forEach(x=>{box(.09,.9,.3,K(0x15141c),x,.25,-.6,ram);box(.09,.06,.31,G(),x,.7,-.6,ram);});
const nvme=part('nvme');box(.9,.2,.04,K(0x2a2933),.1,0,-.74,nvme);box(.5,.03,.05,G(),0,0,-.72,nvme);
const gpu=part('gpu');box(2.3,.95,.3,K(0x15141c),.35,-.8,.15,gpu);box(2.3,.03,.32,G(),.35,-.31,.15,gpu);fan(gpu,-.2,-.8,.3,.4,true);fan(gpu,.9,-.8,.3,.4,true);
const aio=part('aio');box(1.8,.16,.62,K(0x15141c),-.05,1.82,0,aio);
[-.5,.4].forEach(x=>{box(.9,.16,.62,K(0x1d1c26),x,1.66,0,aio);box(.9,.02,.02,G(),x,1.57,.31,aio);});
const blk=new T.Mesh(new T.CylinderGeometry(.3,.3,.2,24),K(0x1a1a22));blk.rotation.x=Math.PI/2;blk.position.set(.3,.85,-.5);aio.add(blk);
const cap=new T.Mesh(new T.CircleGeometry(.2,24),G());cap.position.set(.3,.85,-.39);aio.add(cap);
[[-.1,.85,-.5,-.5,1.2,-.3,-.5,1.55,-.1,-.5,1.7,0],[.5,.9,-.5,.4,1.2,-.3,.4,1.55,-.1,.4,1.7,0]].forEach(a=>{
  const pts=[0,3,6,9].map(i=>new T.Vector3(a[i],a[i+1],a[i+2]));
  aio.add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),24,.05,8,false),K(0x1a1a22)));});
const fans=part('fans');fan(fans,-1.2,1.2,-.3,.42);fan(fans,-1.2,.25,-.3,.42);fan(fans,-1.2,-.7,-.3,.42);fan(fans,1.22,1.2,-.3,.42);
const psu=part('psu');box(3.2,.6,1.5,K(0x15141c),0,-1.62,0,psu);box(3.0,.03,.02,G(),0,-1.33,.76,psu);
const ssd=part('ssd');box(.7,.06,.45,K(0x3a3a46),-1.1,-1.3,.3,ssd);box(.7,.06,.45,K(0x3a3a46),-1.1,-1.2,.3,ssd);
const tl1=new T.PointLight(0xffffff,1.0,6);tl1.position.set(0,1.0,.9);tower.add(tl1);
const glass=new T.Mesh(new T.PlaneGeometry(3.4,3.9),new T.MeshStandardMaterial({color:0x2a2a38,transparent:true,opacity:.18,roughness:.1,metalness:.3,side:T.DoubleSide,depthWrite:false}));
glass.position.z=.86;glass.raycast=function(){};tower.add(glass);

// caméra : glisser pour tourner, molette pour zoomer, clic sur le PC pour entrer dedans
let aspect=1.6,mode='out',dragging=false,lastInput=0,hover=null;
const home={tx:0,ty:1.0,tz:.2,r:19,th:0,ph:.8};
const cur=Object.assign({},home),goal=Object.assign({},home);
function enter(){setHL(hover,false);hover=null;mode='in';hideTip();Object.assign(goal,{tx:4.3,ty:1.95,tz:-.5,r:aspect<1.1?9:6.4,th:0,ph:1.42});backBtn.hidden=false;}
function leave(){setHL(hover,false);hover=null;mode='out';hideTip();Object.assign(goal,home);backBtn.hidden=true;}
backBtn.addEventListener('click',leave);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mode==='in')leave();});

function resolve(o){return(mode==='out'&&o.userData.inTower)?'pc':o.userData.id;}
const ray=new T.Raycaster(),mp=new T.Vector2();
function idAt(e){const r=cv.getBoundingClientRect();mp.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mp,cam);
  const hits=ray.intersectObjects(pick,true);
  for(const h of hits){let o=h.object;while(o&&!o.userData.id)o=o.parent;if(o)return resolve(o);}return null;}
function setHL(id,on){if(!id)return;pick.forEach(o=>{if(resolve(o)!==id)return;o.traverse(c=>{
  if(c.isSprite){const b=c.userData.base||c.scale;c.scale.copy(b).multiplyScalar(on?1.07:1);}
  else if(c.isMesh&&c.material&&c.material.emissive){const m=c.material;
    if(on&&!m.userData.hl){m.userData.hl=1;m.userData.e0=m.emissive.getHex();m.userData.i0=m.emissiveIntensity;m.emissive.setHex(0x1f9a92);m.emissiveIntensity=Math.max(m.userData.i0,.7);}
    else if(!on&&m.userData.hl){m.userData.hl=0;m.emissive.setHex(m.userData.e0);m.emissiveIntensity=m.userData.i0;}}});});}
function hl(id){if(hover===id)return;setHL(hover,false);hover=id;setHL(id,true);}
window.hl3d=hl;

let sx=0,sy=0,moved=0,sth=0,sph=0;
cv.addEventListener('pointermove',e=>{
  if(dragging){const dx=e.clientX-sx,dy=e.clientY-sy;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
    goal.th=sth-dx*.006;goal.ph=Math.min(1.55,Math.max(.35,sph-dy*.005));lastInput=performance.now();if(moved>6)hideTip();return;}
  if(e.pointerType==='mouse'){const id=idAt(e);hl(id);cv.style.cursor=id?'pointer':'default';if(id)showTip(id,e.clientX,e.clientY);else hideTip();}});
cv.addEventListener('pointerup',e=>{dragging=false;if(moved<6){const id=idAt(e);
  if(id==='pc'&&mode==='out')enter();else if(id){hl(id);showTip(id,e.clientX,e.clientY);}else{hl(null);hideTip();}}});
cv.addEventListener('pointerleave',()=>{if(!dragging){hl(null);hideTip();}});

function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);aspect=w/h;cam.aspect=aspect;cam.updateProjectionMatrix();home.r=aspect<1.1?27:19;if(mode==='in')goal.r=aspect<1.1?9:6.4;else goal.r=home.r;}
new ResizeObserver(resize).observe(stage);resize();

function frame(t){requestAnimationFrame(frame);
  const k=reduce?1:.07;for(const p in cur)cur[p]+=(goal[p]-cur[p])*k;
  if(!reduce)spin.forEach(s=>{s.rotation.z-=.06;});
  cam.position.set(cur.tx+cur.r*Math.sin(cur.ph)*Math.sin(cur.th),cur.ty+cur.r*Math.cos(cur.ph),cur.tz+cur.r*Math.sin(cur.ph)*Math.cos(cur.th));
  cam.lookAt(cur.tx,cur.ty,cur.tz);renderer.render(scene,cam);}
requestAnimationFrame(frame);
})();
</script>
